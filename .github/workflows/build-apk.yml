name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: "21"

      - name: Build the app
        run: |
          if [ -f gradlew ]; then DIR=.; else DIR=$(dirname "$(find . -maxdepth 3 -name gradlew | head -1)"); fi
          cd "$DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/out/VibeVideoCast.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: VibeVideoCast-apk
          path: out/VibeVideoCast.apk
